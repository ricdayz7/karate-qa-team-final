name: Pruebas de Automatizacion

  on:
  push:
    branches: [ main ]

  jobs:
    prueba:
      runs-on: ubuntu-latest

      steps:
      - name: Validar consola
        run : echo "Hola, esta es una prueba de automatizacion en GitHub Actions"

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/